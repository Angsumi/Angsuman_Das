name: Refresh dashboard
on:
  schedule: [{cron: '0 3 * * 1'}]
  workflow_dispatch:
  push:
    paths: [projects.json, template.html, repos.template.html, style.css, build.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git add repos.html; git diff --quiet HEAD -- index.html repos.html && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "Refresh dashboard data" && git push
